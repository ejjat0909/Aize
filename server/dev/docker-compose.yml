# Dev data stack: own basemap tiles + routing graph from a regional OSM extract.
#
# NOT RUN by CI and not run on the build machine (no Docker there); treat it as reviewed-but-untested
# until someone with Docker runs it. The production path in server/README.md does not need this.
#
#   OSM_PBF=malaysia-singapore-brunei-latest.osm.pbf docker compose -f server/dev/docker-compose.yml run --rm planetiler
#   docker compose -f server/dev/docker-compose.yml up valhalla
services:
  planetiler:
    image: ghcr.io/onthegomap/planetiler:latest
    volumes:
      - ../../data/osm:/data/osm:ro
      - ../../data/tiles:/data/tiles
    # Planetiler needs ~1 GB of heap per 100 MB of extract; raise for larger regions.
    environment:
      JAVA_TOOL_OPTIONS: -Xmx4g
    command: >
      --osm-path=/data/osm/${OSM_PBF:-malaysia-singapore-brunei-latest.osm.pbf}
      --output=/data/tiles/region.pmtiles
      --force

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    volumes:
      - ../../data/osm:/data/osm:ro
      - ../../data/valhalla:/data/valhalla
    ports: ["8010:8002"]
    # The image ships valhalla_service; building tiles first keeps startup predictable.
    command: ["valhalla_service", "/data/valhalla/valhalla.json", "2"]
