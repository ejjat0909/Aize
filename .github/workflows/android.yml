name: android
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0"
      - name: Design tokens are in sync with the generated Kotlin and map styles
        run: python3 design/generate_android.py --check
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Debug APK (without bundled dev tiles)
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: aize-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
